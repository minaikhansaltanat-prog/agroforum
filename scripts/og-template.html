<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";font-weight:700;src:url(../site/fonts/montserrat-700.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:800;src:url(../site/fonts/montserrat-800.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url(../site/fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(../site/fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url(../site/fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:700;src:url(../site/fonts/inter-700.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#FBF8F1;font-family:Inter,sans-serif;color:#0B1F3A;position:relative;overflow:hidden}
.sun{position:absolute;right:-120px;top:-60px;width:720px;height:720px;border-radius:50%;background:#C9A24A;opacity:.17}
.left{position:absolute;left:64px;top:52px;width:610px}
.logos{display:flex;align-items:center;gap:18px}
.logos img{height:52px;width:auto;display:block}
.logos .c{height:36px}
.logos i{width:1px;height:40px;background:rgba(11,31,58,.18)}
.brand{margin-top:40px;font:800 25px/1 Montserrat;color:#2E7D4F;letter-spacing:-.01em}
h1{margin-top:14px;font:800 64px/1.03 Montserrat;letter-spacing:-.035em}
.sub{margin-top:18px;font:500 21px/1.4 Inter;color:#2B3D57;max-width:560px}
.chips{position:absolute;left:64px;bottom:50px;display:flex;gap:12px}
.chip{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;background:#fff;font:700 20px Montserrat;box-shadow:0 10px 24px -12px rgba(11,31,58,.35)}
.chip.gold{background:#C9A24A}
.ph{position:absolute;border-radius:26px;overflow:hidden;border:7px solid #fff;box-shadow:0 30px 50px -26px rgba(11,31,58,.5);background:#F3EEE2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.w{right:44px;top:50px;width:370px;height:246px}
.l{right:288px;top:196px;width:290px;height:362px;z-index:2}
.h{right:44px;bottom:52px;width:232px;height:232px;z-index:3}
</style></head>
<body>
<div class="sun"></div>
<div class="left">
  <div class="logos"><img src="../site/img/logo-kasipker-360.webp"><i></i><img class="c" src="../site/img/logo-caea-480.webp"><i></i><img src="../site/img/logo-kaznaru-273.webp"></div>
  <div class="brand">Агрофорум 2026</div>
  <h1>Ғылым мен тәжірибе диалогы</h1>
  <p class="sub">Қазақстанның ауыл шаруашылығын дамытудың өзекті мәселелері</p>
</div>
<div class="chips"><span class="chip">3 желтоқсан 2026 · Алматы</span><span class="chip gold">5&nbsp;000&nbsp;₸-ден</span></div>
<div class="ph w"><img src="../site/img/hero-wheat-960.webp"></div>
<div class="ph l"><img src="../site/img/hero-lab-760.webp"></div>
<div class="ph h"><img src="../site/img/hero-herd-640.webp"></div>
</body></html>
